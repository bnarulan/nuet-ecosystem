const tp = id => state.topics[id]||{status:'not-started',confidence:0,tasks:{},note:'',reviewDate:''};
const putTopic = (id,changes) => {state.topics[id]={...tp(id),...changes};save()};
const save = () => {try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Cannot save locally. Check browser storage permissions.')}};
const toast = text => {const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)};
const statusLabel={'not-started':'Not started',learning:'Learning',practicing:'Practicing',mastered:'Mastered'};
const getTopic=id=>TOPICS.find(t=>t.id===id);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const clamp=(n,min,max)=>Math.max(min,Math.min(max,Number(n)||0));
const answered=()=>state.sessions.reduce((a,s)=>a+Number(s.attempted||0),0);
const correct=()=>state.sessions.reduce((a,s)=>a+Number(s.correct||0),0);
const recentDates=n=>Array.from({length:n},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(n-1-i));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`});
const last7=()=>recentDates(7);
const minutesOn=day=>state.sessions.filter(s=>s.date===day).reduce((a,s)=>a+Number(s.minutes||0),0)+state.mocks.filter(m=>m.date===day).reduce((a,s)=>a+Number(s.minutes||0),0);
const weekMinutes=()=>last7().reduce((a,d)=>a+minutesOn(d),0);
const streak=()=>{const activity=new Set([...state.sessions,...state.mocks].map(x=>x.date));let d=new Date();if(!activity.has(getToday()))d.setDate(d.getDate()-1);let n=0;while(n<365){let str=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(!activity.has(str))break;n++;d.setDate(d.getDate()-1)}return n};
const totalTasks=()=>TOPICS.reduce((a,t)=>a+TASKS.filter(k=>tp(t.id).tasks?.[k.id]).length,0);
const countStatus=status=>TOPICS.filter(t=>tp(t.id).status===status).length;
const touched=()=>TOPICS.filter(t=>tp(t.id).status!=='not-started'||TASKS.some(k=>tp(t.id).tasks?.[k.id])).length;
const mockAverage=()=>state.mocks.length?(state.mocks.reduce((a,m)=>a+Number(m.score),0)/state.mocks.length).toFixed(1):'—';
const examCountdown=()=>{if(!state.settings.examDate)return '';const n=Math.ceil((parseDate(state.settings.examDate)-parseDate(getToday()))/86400000);return n>0?`${n} days until your target exam`:n===0?'Your target exam date is today':`Target exam date was ${Math.abs(n)} days ago`};
const due=t=>tp(t.id).reviewDate && tp(t.id).reviewDate<=getToday() && tp(t.id).status!=='mastered';
const focusTopics=()=>TOPICS.filter(t=>tp(t.id).status!=='mastered').sort((a,b)=>{
 const rank=t=>(due(t)?-100:0)+(tp(t.id).status==='practicing'?-20:tp(t.id).status==='learning'?-10:0)+Number(tp(t.id).confidence||0)*3;
 return rank(a)-rank(b)
}).slice(0,4);
const activityChart=()=>{const dates=last7(),values=dates.map(minutesOn),max=Math.max(30,...values);return `<div class="bars">${dates.map((d,i)=>`<div class="bar-col"><div class="bar-wrap"><div class="bar" data-tip="${values[i]} min" style="height:${Math.max(3,pct(values[i],max))}%"></div></div><label>${fmtShort(d)}</label></div>`).join('')}</div>`};
const groupBars=()=>GROUPS.map(g=>{const list=TOPICS.filter(t=>t.group===g.id),num=list.filter(t=>tp(t.id).status==='mastered').length,started=list.filter(t=>tp(t.id).status!=='not-started').length;return `<div class="group-row"><div class="group-head"><strong>${esc(g.name)}</strong><span>${num}/${list.length} mastered · ${started} started</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct(num,list.length)}%"></div></div></div>`}).join('');
const empty=(icon,title,desc)=>`<div class="empty"><div class="empty-symbol">${icon}</div><strong>${title}</strong>${desc}</div>`;
function dashboard(){let completed=countStatus('mastered'),accuracy=answered()?`${pct(correct(),answered())}%`:'—',weekly=weekMinutes(),goal=clamp(state.settings.weeklyGoal,1,2000),focus=focusTopics();return `
<div class="hero"><div><div class="hero-tag">YOUR PERSONAL MATH WORKSPACE</div><h1>Small steps.<br>Stronger mathematics.</h1><p>Follow the official NUET topic list, build consistency and turn every mistake into progress.</p><button class="btn" data-nav="syllabus">Explore your topics <span aria-hidden="true">→</span></button></div><div class="hero-ring" style="--pct:${pct(completed,TOPICS.length)}%"><div class="hero-ring-in"><strong>${pct(completed,TOPICS.length)}%</strong><small>mastered</small></div></div></div>
<div class="stat-grid">
  <div class="card stat"><div class="stat-icon blue">▦</div><div class="stat-number">${touched()} <span class="muted" style="font-size:14px">/ ${TOPICS.length}</span></div><div class="stat-sub">Topics started</div></div>

  <div class="card stat"><div class="stat-icon peach">◎</div><div class="stat-number">${accuracy}</div><div class="stat-sub">Practice accuracy · ${answered()} questions</div></div>

</div>
<div class="two-col"><div class="card card-pad"><div class="card-header"><div><h2>Weekly study activity</h2><p>Minutes recorded from practice and mock sessions</p></div><span class="pill practicing">Last 7 days</span></div>${activityChart()}<div class="faint-line" style="margin-top:20px;padding-top:15px"><div class="group-head"><strong>Weekly target</strong><span>${weekly} / ${goal} min</span></div><div class="progress-track"><div class="progress-fill green" style="width:${Math.min(100,pct(weekly,goal))}%"></div></div></div></div>
<div class="card card-pad"><div class="card-header"><div><h2>Syllabus mastery</h2><p>Progress through the 2026 specification</p></div><button class="btn small outline" data-nav="syllabus">All topics →</button></div>${groupBars()}</div></div>
<div class="two-col"><div class="card card-pad"><div class="card-header"><div><h2>What to study next</h2><p>${TOPICS.length-completed} topics left to master · based on your progress</p></div><button class="btn small secondary" data-nav="practice">Log a session</button></div><div class="focus-list">${focus.map(t=>`<button class="focus-row" data-open-topic="${t.id}"><div class="focus-icon">${t.id}</div><div class="focus-content"><strong>${esc(t.title)}</strong><span>${esc(t.groupName)} · ${due(t)?'Review due':statusLabel[tp(t.id).status]}</span></div>${due(t)?'<span class="pill due">Due</span>':''}<span class="focus-arrow">›</span></button>`).join('')||empty('★','Every topic mastered!','Keep practicing to maintain your skills.')}</div></div>
<div class="card card-pad"><div class="card-header"><div><h2>Exam readiness log</h2><p>Track evidence, not just the feeling of progress</p></div><button class="btn small outline" data-nav="mocks">Mock tests →</button></div><div class="two-mini"><div class="mini-kpi"><strong>${mockAverage()}<span style="font-size:13px;color:#9aa6b5">/30</span></strong><small>Average mock score</small></div><div class="mini-kpi"><strong>${state.mocks.length}</strong><small>Mocks completed</small></div><div class="mini-kpi"><strong>${totalTasks()}<span style="font-size:13px;color:#9aa6b5">/${TOPICS.length*4}</span></strong><small>Study tasks checked</small></div><div class="mini-kpi"><strong>${state.mistakes.filter(m=>!m.resolved).length}</strong><small>Mistakes to revisit</small></div></div>${examCountdown()?`<div class="hint" style="margin-top:13px">◷ ${esc(examCountdown())}</div>`:''}<button class="btn outline" style="margin-top:17px;width:100%" data-nav="mistakes">Open mistake journal →</button></div></div>
<div class="footer-credit">Topic structure based on your uploaded NUET 2026 Mathematics specification. Tracker is independent and unofficial.</div>`}
function syllabus(){const match=TOPICS.filter(t=>{let p=tp(t.id);return (filters.group==='all'||t.group===filters.group)&&(filters.status==='all'||p.status===filters.status)&&(t.title+' '+t.id+' '+t.detail+' '+t.groupName).toLowerCase().includes(filters.search.toLowerCase())});return `<div class="section-lead"><h1>Topic tracker</h1><p>All 65 outcomes from the NUET 2026 Mathematics specification. Track each separately.</p></div><div class="card card-pad"><div class="section-toolbar"><div class="badge-trail"><span class="pill mastered">${countStatus('mastered')} mastered</span><span class="pill practicing">${countStatus('practicing')} practicing</span><span class="pill learning">${countStatus('learning')} learning</span><span class="pill not-started">${countStatus('not-started')} not started</span></div><span class="tiny muted">${totalTasks()} of ${TOPICS.length*4} practice tasks done</span></div><div class="filters"><label class="searchbox"><input id="topicSearch" aria-label="Search topics" value="${esc(filters.search)}" placeholder="Search a topic, skill or code…"></label><select id="groupFilter" class="field" style="width:170px"><option value="all">All categories</option>${GROUPS.map(g=>`<option value="${g.id}" ${filters.group===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><select id="statusFilter" class="field" style="width:160px"><option value="all">All statuses</option>${Object.keys(statusLabel).map(s=>`<option value="${s}" ${filters.status===s?'selected':''}>${statusLabel[s]}</option>`).join('')}</select></div><div class="table-hint">Click any topic to open its checklist, confidence scale, notes and review date.</div></div>${GROUPS.map(g=>{const items=match.filter(t=>t.group===g.id);if(!items.length)return '';const isCollapsed=collapsed.has(g.id);return `<section class="card topic-group"><button class="group-toggle" data-collapse="${g.id}" aria-expanded="${!isCollapsed}"><span class="group-left"><span class="group-badge">${g.id}</span><span><strong>${esc(g.name)}</strong><small>${items.length} shown · ${TOPICS.filter(t=>t.group===g.id).length} total objectives</small></span></span><span class="muted">${isCollapsed?'＋':'−'}</span></button>${isCollapsed?'':items.map(t=>{let p=tp(t.id);let done=TASKS.filter(k=>p.tasks?.[k.id]).length;return `<div class="topic-item" data-open-topic="${t.id}" role="button" tabindex="0" aria-label="Open ${esc(t.title)}"><span class="topic-id">${t.id}</span><div style="min-width:0"><div class="topic-item-title">${esc(t.title)}</div><div class="topic-item-desc">${esc(t.detail)}</div></div><div class="mini-progress">${done}/4 tasks<div class="progress-track"><div class="progress-fill" style="width:${pct(done,4)}%"></div></div></div><div class="topic-dots" title="Confidence ${p.confidence||0} of 5">${Array.from({length:5},(_,i)=>`<span class="dot ${i<(p.confidence||0)?'filled':''}"></span>`).join('')}</div><span class="pill ${p.status}">${statusLabel[p.status]||'Not started'}</span><span class="chev">›</span></div>`}).join('')}</section>`}).join('')||`<div class="card">${empty('⌕','No matching topics','Try another search or filter.')}</div>`}`}
function topicDrawer(id){const t=getTopic(id);if(!t)return;selectedTopic=id;let p=tp(id);const done=TASKS.filter(k=>p.tasks?.[k.id]).length;document.getElementById('drawerHeader').innerHTML=`<div><div class="eyebrow muted">${t.id} · ${esc(t.groupName)}</div><h2>${esc(t.title)}</h2><span class="pill ${p.status}">${statusLabel[p.status]||'Not started'}</span></div><button class="icon-btn" data-close-drawer title="Close" aria-label="Close topic">✕</button>`;
document.getElementById('drawerBody').innerHTML=`<div class="field-block"><div class="field-label">WHAT YOU NEED TO LEARN</div><div style="font-size:13px;color:#52617b;line-height:1.7">${esc(t.detail)}</div><div class="tiny muted" style="margin-top:6px">Matched to syllabus objective ${t.id}.</div></div><div class="sep"></div><div class="field-block"><label class="field-label" for="topicStatus">Learning stage</label><select class="field" id="topicStatus">${Object.keys(statusLabel).map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${statusLabel[s]}</option>`).join('')}</select></div><div class="field-block"><label class="field-label">How confident do you feel?</label><div class="confidence-scale">${Array.from({length:5},(_,i)=>`<button class="confidence-btn ${i<(p.confidence||0)?'on':''}" data-confidence="${i+1}" title="Confidence ${i+1} of 5">${i+1}</button>`).join('')}</div><div class="tiny muted" style="margin-top:6px">1 = unfamiliar · 5 = can solve independently</div></div><div class="sep"></div><div class="section-toolbar"><h3 class="subsection" style="margin:0">Practice checklist</h3><span class="tiny muted">${done}/4 completed</span></div><div class="checklist">${TASKS.map(task=>`<label class="check-item"><input type="checkbox" data-task="${task.id}" ${p.tasks?.[task.id]?'checked':''}><span><strong>${task.name}</strong><small>${task.hint}</small></span></label>`).join('')}</div><div class="sep"></div><div class="field-block"><label class="field-label" for="reviewDate">Next review date</label><input class="field" type="date" id="reviewDate" value="${esc(p.reviewDate||'')}"></div><div class="field-block"><label class="field-label" for="topicNote">My notes / formulas / weak spots</label><textarea class="field textarea" id="topicNote" placeholder="What still feels tricky? Which formula do you need to remember?">${esc(p.note||'')}</textarea></div><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><button class="btn" id="saveTopicNote">Save notes</button><button class="btn outline" id="topicPractice">＋ Log practice</button></div><div class="data-note">Tasks, confidence, dates and status save automatically. Use the notes button to save your text.</div>`;
document.getElementById('drawerMask').classList.add('open');document.getElementById('topicDrawer').classList.add('open');document.body.style.overflow='hidden'}
function closeDrawer(){selectedTopic=null;document.getElementById('drawerMask').classList.remove('open');document.getElementById('topicDrawer').classList.remove('open');document.body.style.overflow=''}
function practice(){const sessions=[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="section-lead"><h1>Practice log</h1><p>Record every question set. Your accuracy and study-time charts update automatically.</p></div><div class="stat-grid"><div class="card stat"><div class="stat-icon blue">✎</div><div class="stat-number">${state.sessions.length}</div><div class="stat-sub">Practice sessions</div></div><div class="card stat"><div class="stat-icon mint">✓</div><div class="stat-number">${correct()}</div><div class="stat-sub">Correct answers</div></div><div class="card stat"><div class="stat-icon peach">◎</div><div class="stat-number">${answered()?pct(correct(),answered())+'%':'—'}</div><div class="stat-sub">Overall accuracy</div></div><div class="card stat"><div class="stat-icon lilac">◷</div><div class="stat-number">${state.sessions.reduce((a,s)=>a+Number(s.minutes),0)}</div><div class="stat-sub">Minutes spent practicing</div></div></div><div class="form-layout"><div class="card card-pad"><div class="card-header"><div><h2>Log a practice session</h2><p>One entry per worksheet, drill or question set</p></div></div><form id="practiceForm"><div class="field-block"><label class="field-label" for="practiceTopic">Topic studied</label><select class="field" required id="practiceTopic">${TOPICS.map(t=>`<option value="${t.id}">${t.id} · ${esc(t.title)}</option>`).join('')}</select></div><div class="split-inputs"><div class="field-block"><label class="field-label" for="practiceDate">Date</label><input class="field" required type="date" id="practiceDate" value="${getToday()}"></div><div class="field-block"><label class="field-label" for="practiceSource">Source</label><select class="field" id="practiceSource"><option>Topic exercises</option><option>2022 official sample</option><option>2022 specimen</option><option>2021 sample</option><option>Unofficial practice paper</option><option>Other</option></select></div></div><div class="split-inputs three"><div class="field-block"><label class="field-label" for="practiceAttempt">Attempted</label><input class="field" id="practiceAttempt" type="number" required min="1" max="1000" value="10"></div><div class="field-block"><label class="field-label" for="practiceCorrect">Correct</label><input class="field" id="practiceCorrect" type="number" required min="0" max="1000" value="8"></div><div class="field-block"><label class="field-label" for="practiceMinutes">Minutes</label><input class="field" id="practiceMinutes" type="number" required min="1" max="600" value="20"></div></div><div class="field-block"><label class="field-label" for="practiceNote">Notes (optional)</label><textarea id="practiceNote" class="field textarea" placeholder="What did you practice? What should you review?"></textarea></div><button type="submit" class="btn" style="width:100%">＋ Save practice session</button></form></div><div class="card card-pad"><div class="card-header"><div><h2>Session history</h2><p>Your work, newest first</p></div><span class="pill practicing">${sessions.length} entries</span></div>${sessions.length?sessions.map(s=>{const t=getTopic(s.topic);return `<div class="list-row"><div class="row-flex"><strong>${esc(t?t.title:s.topic)}</strong><small>${fmtDate(s.date)} · ${esc(s.source)} · ${esc(s.minutes)} min</small>${s.note?`<small>${esc(s.note)}</small>`:''}</div><span class="score ${pct(s.correct,s.attempted)>=80?'good':pct(s.correct,s.attempted)>=60?'mid':'low'}">${esc(s.correct)}/${esc(s.attempted)}</span><button class="icon-btn" data-delete-session="${s.id}" aria-label="Delete practice session" title="Delete">×</button></div>`}).join(''):empty('✎','No sessions yet','Log your first 10-question drill to start tracking accuracy.')}</div></div>`}
function mocks(){const records=[...state.mocks].sort((a,b)=>a.date.localeCompare(b.date)),recent=[...records].reverse();return `<div class="section-lead"><h1>Mock tests</h1><p>Track full-paper performance and your exam-time pacing over time.</p></div><div class="callout">The uploaded <b>2022 specimen</b> uses <b>30 questions in 60 minutes, no calculator</b>. Use that as your timed-practice format; it is not a guarantee of future test conditions.</div><div class="form-layout"><div class="card card-pad"><div class="card-header"><div><h2>Record a mock test</h2><p>Add a score after you finish a paper</p></div></div><form id="mockForm"><div class="field-block"><label class="field-label" for="mockSource">Paper</label><select class="field" id="mockSource"><option>2022 official specimen</option>${Array.from({length:12},(_,i)=>`<option>Practice paper ${i+1} (unofficial)</option>`).join('')}<option>Other mock test</option></select></div><div class="split-inputs three"><div class="field-block"><label class="field-label" for="mockScore">Score /30</label><input class="field" id="mockScore" type="number" min="0" max="30" required placeholder="e.g. 22"></div><div class="field-block"><label class="field-label" for="mockMinutes">Time (min)</label><input class="field" id="mockMinutes" type="number" min="1" max="240" value="60" required></div><div class="field-block"><label class="field-label" for="mockDate">Date</label><input class="field" id="mockDate" type="date" value="${getToday()}" required></div></div><div class="field-block"><label class="field-label" for="mockNotes">Reflection (optional)</label><textarea class="field textarea" id="mockNotes" placeholder="Which 3 topics cost you the most marks?"></textarea></div><button class="btn" type="submit" style="width:100%">＋ Add mock result</button></form></div><div class="card card-pad"><div class="card-header"><div><h2>Score trend</h2><p>Marks out of 30, oldest to newest</p></div><span class="pill learning">Goal: ${esc(state.settings.goalScore)}/30</span></div><div class="chart-line-wrap">${renderMockChart(records)}</div><div class="two-mini"><div class="mini-kpi"><strong>${records.length?Math.max(...records.map(m=>Number(m.score))):'—'}<small>/30</small></strong><small>Best score</small></div><div class="mini-kpi"><strong>${mockAverage()}<small>/30</small></strong><small>Average score</small></div></div></div></div><div class="card card-pad" style="margin-top:20px"><div class="card-header"><div><h2>Mock history</h2><p>Review your exam performances</p></div></div>${recent.length?recent.map(m=>`<div class="list-row"><div class="row-flex"><strong>${esc(m.source)}</strong><small>${fmtDate(m.date)} · ${m.minutes} minutes</small>${m.notes?`<small>${esc(m.notes)}</small>`:''}</div><span class="score ${m.score>=25?'good':m.score>=18?'mid':'low'}">${m.score}/30</span><button class="icon-btn" data-delete-mock="${m.id}" title="Delete" aria-label="Delete mock">×</button></div>`).join(''):empty('◷','No mock tests yet','After completing a paper, enter your score to reveal your progress chart.')}</div>`}
function renderMockChart(records){if(!records.length)return empty('◷','Your chart will appear here','Add your first mock score to begin.');const w=660,h=210,l=37,r=14,t=18,b=32,plotW=w-l-r,plotH=h-t-b,min=0,max=30;const points=records.map((m,i)=>({x:l+(records.length===1?plotW/2:(i/(records.length-1))*plotW),y:t+plotH-Number(m.score)/max*plotH,score:m.score}));const path=points.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');const goalY=t+plotH-clamp(state.settings.goalScore,0,30)/30*plotH;return `<svg viewBox="0 0 ${w} ${h}" aria-label="Mock score trend chart" role="img"><g font-size="11" fill="#8794a7">${[0,10,20,30].map(n=>`<line x1="${l}" y1="${t+plotH-n/30*plotH}" x2="${w-r}" y2="${t+plotH-n/30*plotH}" stroke="#e8ecf4"/><text x="${l-11}" y="${t+plotH-n/30*plotH+4}" text-anchor="end">${n}</text>`).join('')}</g><line x1="${l}" y1="${goalY}" x2="${w-r}" y2="${goalY}" stroke="#b3a1eb" stroke-dasharray="4 4"/><path d="${path}" fill="none" stroke="#6474e9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${points.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#fff" stroke="#6577ed" stroke-width="3"><title>Mock ${i+1}: ${p.score}/30</title></circle>`).join('')}<text x="${l}" y="${h-6}" fill="#93a0b1" font-size="11">First mock</text><text x="${w-r}" y="${h-6}" fill="#93a0b1" text-anchor="end" font-size="11">Latest mock</text></svg>`}

uted" style="margin-top:6px">${v.attempted?`${pct(v.correct,v.attempted)}% practice accuracy · ${v.attempted} questions`:'No recorded practice questions yet'}</div></div>`).join('')}</div><div class="card card-pad"><div class="card-header"><div><h2>Why marks are lost</h2><p>Unresolved errors grouped by reason</p></div></div>${unresolved.length?mistakeTypes.map(type=>{const n=unresolved.filter(m=>m.type===type).length;return n?`<div class="group-row"><div class="group-head"><strong>${type}</strong><span>${n}</span></div><div class="progress-track"><div class="progress-fill green" style="width:${pct(n,unresolved.length)}%"></div></div></div>`:''}).join(''):empty('◇','No unresolved errors','Use the mistake journal to see which error types repeat.')}<div class="faint-line" style="padding-top:18px;margin-top:15px"><b>${streak()}-day</b> current study streak <span class="muted">(practice or mocks)</span></div></div></div><div class="card card-pad"><div class="card-header"><div><h2>Topics to strengthen</h2><p>Low confidence or unfinished topics, with direct links to the study checklist</p></div><button class="btn small secondary" data-nav="syllabus">See syllabus</button></div><div class="focus-list">${focus.map(t=>`<button class="focus-row" data-open-topic="${t.id}"><span class="focus-icon">${t.id}</span><span class="focus-content"><strong>${esc(t.title)}</strong><span>Confidence ${tp(t.id).confidence||0}/5 · ${esc(t.groupName)}</span></span><span class="focus-arrow">›</span></button>`).join('')||empty('✓','All topics mastered','Keep using mock tests to retain your skills.')}</div></div>`}
function resources(){const shown=RESOURCES.filter(r=>resourceFilter==='all'||r.type===resourceFilter);return `<div class="section-lead"><h1>Practice paper library</h1><p>Your uploaded NUET resources, available offline when using the full website folder.</p></div><div class="callout">Click <b>Open PDF</b> to read a paper in a new tab. You can then record practice by topic or log a full timed mock. The 12 numbered papers are <b>unofficial</b> practice, not official NUET exam papers.</div><div class="section-toolbar" style="margin-bottom:18px"><span class="muted tiny">${RESOURCES.length} documents included in the ZIP package</span><select class="field" id="resourceFilter" style="width:165px"><option value="all" ${resourceFilter==='all'?'selected':''}>All resources</option><option value="official" ${resourceFilter==='official'?'selected':''}>Official materials</option><option value="unofficial" ${resourceFilter==='unofficial'?'selected':''}>Unofficial practice</option></select></div><div class="resource-grid">${shown.map(r=>`<div class="card resource-card"><div class="resource-icon">▤</div><span class="chip" style="align-self:flex-start">${r.tag}</span><h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p><a class="btn outline" target="_blank" rel="noopener noreferrer" href="resources/${encodeURIComponent(r.file)}">Open PDF ↗</a></div>`).join('')}</div>`}

function vocabularyEntries(){
  const query=vocabSearch.trim().toLocaleLowerCase();
  return state.vocabulary.filter(entry=>(vocabFilter==='all'||(vocabFilter==='known'?entry.known:!entry.known))&&(!query||`${entry.word}\n${entry.definition}`.toLocaleLowerCase().includes(query)));
}
function vocabularyDeck(){
  const entries=vocabularyEntries(),currentId=vocabOrder[vocabIndex],ids=new Set(entries.map(entry=>entry.id));
  vocabOrder=vocabOrder.filter(id=>ids.has(id));
  const ordered=new Set(vocabOrder);
  entries.forEach(entry=>{if(!ordered.has(entry.id))vocabOrder.push(entry.id)});
  const currentIndex=vocabOrder.indexOf(currentId);
  vocabIndex=currentIndex>=0?currentIndex:Math.min(vocabIndex,Math.max(0,vocabOrder.length-1));
  const byId=new Map(entries.map(entry=>[entry.id,entry]));
  return vocabOrder.map(id=>byId.get(id));
}

function saveVocabulary(form){

  if(!deck.length)return;
  switch(action.dataset.vocabAction){
    case 'flip':vocabRevealed=!vocabRevealed;break;
    case 'next':vocabIndex=(vocabIndex+1)%deck.length;vocabRevealed=false;break;
    case 'previous':vocabIndex=(vocabIndex-1+deck.length)%deck.length;vocabRevealed=false;break;
    case 'shuffle':for(let i=vocabOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vocabOrder[i],vocabOrder[j]]=[vocabOrder[j],vocabOrder[i]]}vocabIndex=0;vocabRevealed=false;break;
    case 'known':case 'learning':if(!vocabRevealed)return;deck[vocabIndex].known=action.dataset.vocabAction==='known';if(deck.length>1)vocabIndex=(vocabIndex+1)%deck.length;save();vocabRevealed=false;break;
    default:return;
  }
  renderVocabulary('[data-vocab-action="flip"]');
}
document.addEventListener('click',handleVocabularyClick);
document.addEventListener('input',e=>{
  if(e.target.id==='vocabWord')vocabDraft.word=e.target.value;
  if(e.target.id==='vocabDefinition')vocabDraft.definition=e.target.value;
  if(e.target.id==='vocabSearch'){vocabSearch=e.target.value;const pos=e.target.selectionStart;vocabOrder=[];vocabIndex=0;vocabRevealed=false;renderVocabulary('#vocabSearch');if(pos!==null)document.getElementById('vocabSearch').setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{if(e.target.id==='vocabFilter'){vocabFilter=e.target.value;vocabOrder=[];vocabIndex=0;vocabRevealed=false;renderVocabulary('#vocabFilter')}});
const labels={overview:'Overview',syllabus:'Topic tracker',practice:'Practice log',mocks:'Mock tests',mistakes:'Mistake journal',analytics:'Analytics',vocabulary:'Vocabulary',resources:'Practice papers',settings:'Settings & backup'};
function render(){document.getElementById('crumbName').textContent=labels[currentView]||'Overview';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===currentView));document.getElementById('content').innerHTML=({overview:dashboard,syllabus,practice,mocks,mistakes,analytics,vocabulary,resources,settings}[currentView]||dashboard)();if(currentView==='practice'&&pendingPracticeTopic){let s=document.getElementById('practiceTopic');if(s)s.value=pendingPracticeTopic;pendingPracticeTopic=null}}
let pendingPracticeTopic=null;
function nav(view){if(!labels[view])view='overview';closeDrawer();currentView=view;window.location.hash=view;setNavigationOpen(false,document.getElementById('sidebar').classList.contains('open'));render();window.scrollTo({top:0,behavior:'instant'})}
function randomId(){return `${Date.now()}-${Math.floor(Math.random()*1000000)}`}
function handleSubmit(form){if(form.id==='vocabularyForm'){saveVocabulary(form);return}if(form.id==='practiceForm'){const attempted=+document.getElementById('practiceAttempt').value,correctNum=+document.getElementById('practiceCorrect').value,minutes=+document.getElementById('practiceMinutes').value;if(!Number.isInteger(attempted)||attempted<1||correctNum<0||correctNum>attempted||minutes<1){toast('Correct answers cannot exceed attempted questions.');return}const topic=document.getElementById('practiceTopic').value;state.sessions.push({id:randomId(),topic,date:document.getElementById('practiceDate').value,source:document.getElementById('practiceSource').value,attempted,correct:correctNum,minutes,note:document.getElementById('practiceNote').value.trim()});if(tp(topic).status==='not-started')putTopic(topic,{status:'practicing'});save();toast('Practice session saved');render()}
if(form.id==='mockForm'){const score=+document.getElementById('mockScore').value,minutes=+document.getElementById('mockMinutes').value;if(!Number.isInteger(score)||score<0||score>30||minutes<1){toast('Use a score from 0 to 30.');return}state.mocks.push({id:randomId(),source:document.getElementById('mockSource').value,score,minutes,date:document.getElementById('mockDate').value,notes:document.getElementById('mockNotes').value.trim()});save();toast('Mock test saved');render()}
if(form.id==='mistakeForm'){state.mistakes.push({id:randomId(),topic:document.getElementById('mistakeTopic').value,ref:document.getElementById('mistakeRef').value.trim(),type:document.getElementById('mistakeType').value,why:document.getElementById('mistakeWhy').value.trim(),fix:document.getElementById('mistakeFix').value.trim(),date:document.getElementById('mistakeDate').value,review:document.getElementById('mistakeReview').value,resolved:false});save();toast('Mistake added');render()}
if(form.id==='settingsForm'){state.settings.weeklyGoal=clamp(document.getElementById('weeklyGoal').value,10,5000);state.settings.goalScore=clamp(document.getElementById('goalScore').value,0,30);state.settings.examDate=document.getElementById('examDate').value;save();toast('Targets updated');render()}}
function exportData(){const data=new Blob([JSON.stringify({app:'NUET Math Studio',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(data);let a=document.createElement('a');a.href=url;a.download=`nuet-math-progress-${getToday()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress backup downloaded')}
async function importData(file){
  if(!file)return;
  try{
    const data=JSON.parse(await file.text()),loaded=data.state||data;
    if(!loaded||typeof loaded!=='object'||!Array.isArray(loaded.sessions)||!Array.isArray(loaded.mocks)||!Array.isArray(loaded.mistakes)||!loaded.topics||typeof loaded.topics!=='object')throw new Error('Invalid backup format');
    if(loaded.vocabulary!==undefined&&(!Array.isArray(loaded.vocabulary)||loaded.vocabulary.some(entry=>!entry||typeof entry.word!=='string'||!entry.word.trim()||typeof entry.definition!=='string'||!entry.definition.trim())))throw new Error('Invalid vocabulary format');
    if(!confirm('Import this backup? It will replace your current tracker progress and vocabulary.'))return;
    state={topics:loaded.topics,sessions:loaded.sessions,mocks:loaded.mocks,mistakes:loaded.mistakes,vocabulary:normalizeVocabulary(loaded.vocabulary),settings:{...initial().settings,...(loaded.settings||{})}};
    resetVocabularyUI();save();toast('Backup imported successfully');render();
  }catch(e){toast('Import failed: not a valid tracker backup.')}
}
const content=document.getElementById('content');
document.addEventListener('click',e=>{const btn=e.target.closest('[data-nav]');if(btn){e.preventDefault();nav(btn.dataset.nav);return}const open=e.target.closest('[data-open-topic]');if(open){topicDrawer(open.dataset.openTopic);return}const collapse=e.target.closest('[data-collapse]');if(collapse){let id=collapse.dataset.collapse;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);render();return}if(e.target.closest('[data-close-drawer]')){closeDrawer();return}const conf=e.target.closest('[data-confidence]');if(conf&&selectedTopic){putTopic(selectedTopic,{confidence:+conf.dataset.confidence});topicDrawer(selectedTopic);return}if(e.target.id==='saveTopicNote'&&selectedTopic){putTopic(selectedTopic,{note:document.getElementById('topicNote').value});toast('Topic notes saved');return}if(e.target.id==='topicPractice'&&selectedTopic){pendingPracticeTopic=selectedTopic;nav('practice');return}const delS=e.target.closest('[data-delete-session]');if(delS&&confirm('Delete this practice entry?')){state.sessions=state.sessions.filter(s=>s.id!==delS.dataset.deleteSession);save();render();return}const delM=e.target.closest('[data-delete-mock]');if(delM&&confirm('Delete this mock result?')){state.mocks=state.mocks.filter(m=>m.id!==delM.dataset.deleteMock);save();render();return}const tog=e.target.closest('[data-toggle-mistake]');if(tog){let m=state.mistakes.find(m=>m.id===tog.dataset.toggleMistake);if(m)m.resolved=!m.resolved;save();render();return}const delE=e.target.closest('[data-delete-mistake]');if(delE&&confirm('Delete this mistake entry?')){state.mistakes=state.mistakes.filter(m=>m.id!==delE.dataset.deleteMistake);save();render();return}if(e.target.id==='exportBtn'){exportData();return}if(e.target.id==='importBtn'){document.getElementById('importFile').click();return}if(e.target.id==='resetBtn'&&confirm('Erase ALL topics, practice sessions, mock results, mistakes and vocabulary from this browser? This cannot be undone without a backup.')){state=initial();resetVocabularyUI();save();toast('Tracker reset');render()}});
document.addEventListener('change',e=>{if(e.target.id==='groupFilter'){filters.group=e.target.value;render()}if(e.target.id==='statusFilter'){filters.status=e.target.value;render()}if(e.target.id==='mistakeFilter'){mistakeFilter=e.target.value;render()}if(e.target.id==='resourceFilter'){resourceFilter=e.target.value;render()}if(e.target.id==='topicStatus'&&selectedTopic){putTopic(selectedTopic,{status:e.target.value});topicDrawer(selectedTopic)}if(e.target.id==='reviewDate'&&selectedTopic){putTopic(selectedTopic,{reviewDate:e.target.value});toast('Review date saved')}if(e.target.matches('[data-task]')&&selectedTopic){let p=tp(selectedTopic);putTopic(selectedTopic,{tasks:{...(p.tasks||{}),[e.target.dataset.task]:e.target.checked}});topicDrawer(selectedTopic)}if(e.target.id==='importFile'){importData(e.target.files[0])}});
document.addEventListener('input',e=>{if(e.target.id==='topicSearch'){filters.search=e.target.value;const pos=e.target.selectionStart;render();const fresh=document.getElementById('topicSearch');if(fresh){fresh.focus();fresh.setSelectionRange(pos,pos)}}});
document.addEventListener('submit',e=>{if(['practiceForm','mockForm','mistakeForm','settingsForm','vocabularyForm'].includes(e.target.id)){e.preventDefault();handleSubmit(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();if(document.getElementById('sidebar').classList.contains('open'))setNavigationOpen(false,true)}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open-topic]')){e.preventDefault();topicDrawer(e.target.dataset.openTopic)}});
document.getElementById('drawerMask').addEventListener('click',closeDrawer);
function setNavigationOpen(open,restoreFocus=false){
  document.getElementById('sidebar').classList.toggle('open',open);
  document.getElementById('navBackdrop').hidden=!open;
  document.querySelector('main').inert=open;
  document.body.classList.toggle('navigation-open',open);
  const button=document.getElementById('menuBtn');
  button.setAttribute('aria-expanded',String(open));
  if(open)document.querySelector('.nav-btn.active')?.focus({preventScroll:true});
  else if(restoreFocus)button.focus();
}
document.getElementById('menuBtn').addEventListener('click',()=>setNavigationOpen(!document.getElementById('sidebar').classList.contains('open')));
document.getElementById('navBackdrop').addEventListener('click',()=>setNavigationOpen(false,true));
matchMedia('(max-width: 900px)').addEventListener('change',event=>{if(!event.matches)setNavigationOpen(false)});
document.getElementById('currentDate').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const hash=window.location.hash.slice(1);if(labels[hash])currentView=hash;render();
</script>
